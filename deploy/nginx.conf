# Example Nginx reverse proxy for open-qr with HTTPS (Let's Encrypt / certbot).
# 1. In .env set PUBLIC_BASE_URL=https://qr.example.com (keep BIND_ADDRESS=127.0.0.1)
# 2. Get a certificate:  sudo certbot certonly --nginx -d qr.example.com
# 3. Copy this file to /etc/nginx/sites-available/open-qr, enable it, reload nginx.
# 4. Set FORWARDED_ALLOW_IPS to the address nginx connects from as seen by the
#    container (for a host nginx this is the Docker bridge gateway, often
#    172.17.0.1 / 172.18.0.1 - check with: docker network inspect open-qr_web).

server {
    listen 80;
    listen [::]:80;
    server_name qr.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name qr.example.com;

    ssl_certificate     /etc/letsencrypt/live/qr.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qr.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
